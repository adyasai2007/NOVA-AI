name: NOVA CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask PyPDF2

      - name: Check Python syntax
        run: |
          python -m py_compile nova_core.py

      - name: Start NOVA
        run: |
          python nova_core.py > app.log 2>&1 &
          echo $! > app.pid
          sleep 5

      - name: Test NOVA
        run: |
          curl --fail http://127.0.0.1:5000

      - name: Stop NOVA
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi
